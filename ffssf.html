 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Piramidal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .pyramid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .level {
      text-align: center;
      margin: 10px;
      padding: 15px;
      background-color: #4CAF50;
      color: white;
      border-radius: 10px;
      width: 80%;
      max-width: 300px;
      cursor: pointer;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }

    .level:hover {
      background-color: #45a049;
    }

    .level-description {
      display: none;
      margin-top: 10px;
      background-color: #f9f9f9;
      color: #333;
      padding: 10px;
      border-radius: 5px;
    }

  </style>
</head>
<body>

  <div class="pyramid">
    <div class="level" onclick="toggleDescription('level1')">
      <h2>Meta Principal</h2>
      <div class="level-description" id="level1">
        <p>Descripción de la meta principal. Aquí van los grandes objetivos.</p>
      </div>
    </div>

    <div class="level" onclick="toggleDescription('level2')">
      <h2>Submeta 1</h2>
      <div class="level-description" id="level2">
        <p>Descripción de la primera submeta, tareas específicas a realizar.</p>
      </div>
    </div>

    <div class="level" onclick="toggleDescription('level3')">
      <h2>Submeta 2</h2>
      <div class="level-description" id="level3">
        <p>Descripción de la segunda submeta, más tareas y detalles.</p>
      </div>
    </div>
  </div>

  <script>
    function toggleDescription(level) {
      var description = document.getElementById(level);
      if (description.style.display === "block") {
        description.style.display = "none";
      } else {
        description.style.display = "block";
      }
    }
  </script>

</body>
</html>
