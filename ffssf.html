<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Mundial</title>
    <style>
        /* Estilos Básicos para la Página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        section#partidos {
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenido a la Plataforma Mundial</h1>
    </header>

    <section id="partidos">
        <h2>Partidos en Vivo</h2>
        <button id="ver-partido-btn">Ver Partido</button>
        <ul id="lista-partidos"></ul> <!-- Lista de partidos -->
    </section>

    <footer>
        <p>© 2025 Plataforma Mundial</p>
    </footer>

    <script>
        // Array de partidos simulados
        const partidos = [
            { equipo1: 'Equipo A', equipo2: 'Equipo B', hora: '10:00 AM' },
            { equipo1: 'Equipo C', equipo2: 'Equipo D', hora: '1:00 PM' },
            { equipo1: 'Equipo E', equipo2: 'Equipo F', hora: '3:00 PM' }
        ];

        // Función para cargar los partidos
        function cargarPartidos() {
            const listaPartidos = document.getElementById('lista-partidos');
            listaPartidos.innerHTML = ''; // Limpiar la lista antes de agregar nuevos elementos

            partidos.forEach(partido => {
                const item = document.createElement('li');
                item.textContent = `${partido.equipo1} vs ${partido.equipo2} - ${partido.hora}`;
                listaPartidos.appendChild(item);
            });
        }

        // Evento para el botón que carga los partidos
        document.getElementById('ver-partido-btn').addEventListener('click', cargarPartidos);
    </script>
</body>
</html>
